name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock pytest httpx
      - run: python -m pytest -q
      - name: Tracked files contain no secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "tracked .env file found"; exit 1
          fi
