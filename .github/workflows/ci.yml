name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -r app/ingest/requirements.txt -r app/search/requirements.txt pytest httpx
      - run: python -m pytest -q -rs
      - name: Tracked files contain no secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "tracked .env file found"; exit 1
          fi
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bernmatch:ci .
      - name: Start container and probe liveness and readiness
        run: |
          docker run -d --name bm -p 8000:8000 bernmatch:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break || sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz)
          echo "readyz=$code"
          test "$code" = "503"
          docker logs bm
  hf-space-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Hugging Face Space image
        run: docker build -f deploy/hf-space/Dockerfile -t bernmatch-hf:ci .
      - name: Start as uid 1000 on port 7860 and probe
        run: |
          docker run -d --name bmhf --user 1000 -p 7860:7860 bernmatch-hf:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7860/healthz && break || sleep 1
          done
          curl -sf http://127.0.0.1:7860/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/readyz)
          echo "readyz=$code"
          test "$code" = "503"
          docker exec bmhf sh -c 'touch "$BERNMATCH_DATA_DIR/w" && echo data-dir-writable'
          docker logs bmhf
