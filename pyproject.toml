[project]
name = "bernmatch"
version = "0.0.1"
description = "Bern Match research and expertise navigator"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "httpx==0.28.1", "pydantic>=2.9,<3", "uvicorn==0.34.0"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
