<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bern Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Bern Match</h1>
    <p class="sub">Find research partners at UniBE, ARTORG and Diabetes Center Berne. Text only.</p>
    <form id="form">
      <label for="query">Keywords, a question, or a pasted company description</label>
      <textarea id="query" rows="3" maxlength="2000" placeholder="e.g. continuous glucose monitoring sensors"></textarea>
      <div class="row">
        <label for="type">Looking for</label>
        <select id="type">
          <option value="">Anything</option>
          <option value="person">People</option>
          <option value="unit">Groups / units</option>
          <option value="project">Projects</option>
          <option value="infrastructure">Infrastructure</option>
          <option value="service">Services</option>
        </select>
        <label class="inline"><input type="checkbox" id="interpret"> Interpret my request (optional, Apertus)</label>
        <button type="submit">Search</button>
      </div>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ul id="limitations" class="limitations"></ul>
    <section id="needs" class="needs" hidden aria-live="polite"></section>
    <section id="results"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
